<!doctype html><html><head><meta charset="utf-8"><style>
  /* the cover's picture: the dashboard at /app with the phone paired (real 2x capture), and the phone app the Mac
     serves (real 2x capture) held in front of it. 780x404 css px, rendered at 2x into hero-crop.png */
  html,body{margin:0;width:780px;height:404px;overflow:hidden;background:#f4f5f2}
  .dash{position:absolute;left:-14px;top:-24px;width:1080px}
  .phone{position:absolute;left:470px;top:34px;width:262px;padding:9px;border-radius:46px;background:#0b0d0c;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1),0 3px 8px rgba(0,0,0,.22),0 40px 70px -24px rgba(0,0,0,.5)}
  .screen{position:relative;border-radius:37px;overflow:hidden;background:#fff}
  .screen img{display:block;width:100%}
  .island{position:absolute;top:8px;left:50%;width:80px;height:23px;margin-left:-40px;border-radius:99px;background:#000}
</style></head><body>
<img class="dash" src="dash-paired.png">
<div class="phone"><div class="screen"><img src="phone-done.png"><div class="island"></div></div></div>
</body></html>
